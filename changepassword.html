<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f9b8e">
    <title>Change Password — FitFlow</title>
    <link rel="icon" href="logo.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="premium-pages.css">
    <link rel="stylesheet" href="final-ui-polish.css">
</head>
<body>
<main class="settings-page">
    <div class="settings-brand"><a href="settings.html" class="back-link"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to settings</a></div>
    <section class="settings-container password-container" aria-labelledby="password-title">
        <div class="settings-heading"><div><span class="eyebrow"><i class="fa-solid fa-key" aria-hidden="true"></i> Security</span><h1 id="password-title">Change password</h1><p>Use your current password to set a new one.</p></div></div>
        <form id="changePasswordForm">
            <div class="input-group"><label for="currentPassword">Current password</label><div class="password-field"><input type="password" id="currentPassword" autocomplete="current-password" required><button type="button" class="toggle-password" data-target="currentPassword" aria-label="Show current password"><i class="fa-solid fa-eye" aria-hidden="true"></i></button></div></div>
            <div class="input-group"><label for="newPassword">New password</label><div class="password-field"><input type="password" id="newPassword" autocomplete="new-password" minlength="6" required><button type="button" class="toggle-password" data-target="newPassword" aria-label="Show new password"><i class="fa-solid fa-eye" aria-hidden="true"></i></button></div></div>
            <p id="passwordMessage" class="auth-message" role="status" aria-live="polite"></p>
            <button id="changePasswordBtn" type="submit" class="primary-action"><i class="fa-solid fa-key" aria-hidden="true"></i><span>Change password</span></button>
        </form>
    </section>
</main>
<script type="module">
    import { auth, reauthenticateWithCredential, EmailAuthProvider, updatePassword } from "./firebaseConfig.js";

    const form = document.getElementById("changePasswordForm");
    const currentInput = document.getElementById("currentPassword");
    const newInput = document.getElementById("newPassword");
    const message = document.getElementById("passwordMessage");
    const button = document.getElementById("changePasswordBtn");

    document.querySelectorAll(".toggle-password").forEach((toggle) => {
        toggle.addEventListener("click", () => {
            const input = document.getElementById(toggle.dataset.target);
            const icon = toggle.querySelector("i");
            const visible = input.type === "password";
            input.type = visible ? "text" : "password";
            toggle.setAttribute("aria-label", visible ? `Hide ${toggle.dataset.target === "currentPassword" ? "current" : "new"} password` : `Show ${toggle.dataset.target === "currentPassword" ? "current" : "new"} password`);
            icon.classList.toggle("fa-eye", !visible);
            icon.classList.toggle("fa-eye-slash", visible);
        });
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;

        const user = auth.currentUser;
        if (!user?.email) {
            window.location.replace("login.html");
            return;
        }
        if (user.providerData.some((provider) => provider.providerId === "google.com")) {
            message.textContent = "This account uses Google Sign-In. Manage its password through Google.";
            message.className = "auth-message auth-message-error";
            return;
        }

        button.disabled = true;
        message.textContent = "Updating your password...";
        message.className = "auth-message";

        try {
            const credential = EmailAuthProvider.credential(user.email, currentInput.value);
            await reauthenticateWithCredential(user, credential);
            await updatePassword(user, newInput.value);
            currentInput.value = "";
            newInput.value = "";
            message.textContent = "Password updated successfully. Returning to settings...";
            message.className = "auth-message auth-message-success";
            setTimeout(() => window.location.replace("settings.html"), 800);
        } catch (error) {
            console.error("Password change failed:", error);
            message.textContent = "We couldn't update the password. Check the current password and try again.";
            message.className = "auth-message auth-message-error";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
