<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f9b8e">
    <title>Reset Password — FitFlow</title>
    <link rel="icon" href="logo.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
<section class="login-section" aria-labelledby="reset-title">
    <div class="login-container">
        <div class="auth-brand"><img src="logo.webp" alt="FitFlow logo"><span>FitFlow</span></div>
        <h1 id="reset-title">Reset your password</h1>
        <p>Enter your email and we'll send a password reset link if the account can receive one.</p>
        <form id="resetForm" novalidate>
            <div class="input-group">
                <label for="resetEmail">Email address</label>
                <input type="email" id="resetEmail" autocomplete="email" required placeholder="you@example.com">
            </div>
            <p id="resetMessage" class="auth-message" role="status" aria-live="polite"></p>
            <button type="submit" class="login-btn"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send reset link</button>
        </form>
        <a class="auth-secondary-link" href="login.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to login</a>
    </div>
</section>
<script type="module">
    import { auth, sendPasswordResetEmail } from "./firebaseConfig.js";

    const form = document.getElementById("resetForm");
    const emailInput = document.getElementById("resetEmail");
    const message = document.getElementById("resetMessage");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;

        button.disabled = true;
        message.textContent = "Sending reset instructions...";
        message.className = "auth-message";

        try {
            await sendPasswordResetEmail(auth, emailInput.value.trim());
            // Keep the response generic so the page does not reveal whether an email is registered.
            message.textContent = "If that address is registered, a password reset email has been sent. Check your inbox and spam folder.";
            message.className = "auth-message auth-message-success";
            emailInput.value = "";
        } catch (error) {
            console.error("Password reset request failed:", error);
            message.textContent = "We couldn't complete the request right now. Please try again in a moment.";
            message.className = "auth-message auth-message-error";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
